apiVersion: apps/v1
kind: Deployment
metadata: { name: marketpulse-api }
spec:
  replicas: 3
  selector: { matchLabels: { app: marketpulse-api } }
  template:
    metadata: { labels: { app: marketpulse-api } }
    spec:
      containers:
        - name: api
          image: marketpulse/api:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: marketpulse-secrets } }]
