server {
  listen 80;
  server_name _;
  add_header X-Frame-Options DENY;
  add_header X-Content-Type-Options nosniff;
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /socket.io/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { proxy_pass http://frontend:4173; }
}
