services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    depends_on: [mongo, redis]
    ports: ["8080:8080"]
  workers:
    build: .
    command: npm run start --workspace @marketpulse/workers
    env_file: .env
    depends_on: [mongo, redis]
  frontend:
    build: .
    command: npm run preview --workspace @marketpulse/frontend -- --host 0.0.0.0
    ports: ["5173:4173"]
    depends_on: [api]
volumes: { mongo_data: {} }
